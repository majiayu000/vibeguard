name: False Positive Report
description: Report a native check that blocked a legitimate operation
labels: ["false positive"]
body:
  - type: input
    id: version
    attributes:
      label: Runtime and host versions
      description: Include vibeguard-runtime --version, Codex or Claude Code version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized proposed Bash command or Git ref update. Do not include credentials or private paths. Do not execute destructive commands to reproduce a classifier report.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual and expected behavior
      description: Include the native denial or pre-push error and explain why the operation is legitimate. Rules are review topics; v2 has no scoped-suppression configuration.
    validations:
      required: true
