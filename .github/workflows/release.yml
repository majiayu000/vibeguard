name: vibeguard-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: "1.95.0"
  CROSS_VERSION: "0.2.5"
  RUNTIME_MANIFEST: vibeguard-runtime/Cargo.toml
  RUNTIME_VERSION_FILE: vibeguard-runtime/VERSION

jobs:
  validate-runtime-version:
    name: Validate runtime version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert VERSION matches release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < "${RUNTIME_VERSION_FILE}")"
          if [[ -z "${version}" ]]; then
            echo "ERROR: ${RUNTIME_VERSION_FILE} is empty" >&2
            exit 1
          fi
          expected_tag="v${version}"
          if [[ "${TAG_NAME}" != "${expected_tag}" ]]; then
            echo "ERROR: release tag ${TAG_NAME} does not match ${RUNTIME_VERSION_FILE} (${expected_tag})" >&2
            exit 1
          fi
          echo "Runtime version ${version} matches release tag ${TAG_NAME}"

      - name: Assert tag commit is on main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "${TAG_NAME}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "ERROR: release tag ${TAG_NAME} (${tag_commit}) is not reachable from origin/main" >&2
            exit 1
          fi
          echo "Release tag ${TAG_NAME} points to ${tag_commit}, reachable from origin/main"

  build-runtime:
    name: Build runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: validate-runtime-version
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            builder: cargo
            smoke: "1"
          - os: macos-14
            target: x86_64-apple-darwin
            builder: cargo
            smoke: "0"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo
            smoke: "1"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
            smoke: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add "${{ matrix.target }}"
          rustc --version

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64)
        if: matrix.builder == 'cross'
        run: cargo install cross --version "${CROSS_VERSION}" --locked

      - name: Build runtime
        env:
          TARGET: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
        run: |
          if [[ "${BUILDER}" == "cross" ]]; then
            cross build --release --locked --target "${TARGET}" --manifest-path "${RUNTIME_MANIFEST}"
          else
            cargo build --release --locked --target "${TARGET}" --manifest-path "${RUNTIME_MANIFEST}"
          fi

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist/${TARGET}"
          cp "vibeguard-runtime/target/${TARGET}/release/vibeguard-runtime" \
            "dist/${TARGET}/vibeguard-runtime-${TARGET}"
          chmod 0755 "dist/${TARGET}/vibeguard-runtime-${TARGET}"

      - name: Smoke test native binary
        if: matrix.smoke == '1'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          output="$(printf '{"tool":"Bash"}\n' | "dist/${TARGET}/vibeguard-runtime-${TARGET}" json-field tool)"
          test "${output}" = "Bash"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibeguard-runtime-${{ matrix.target }}
          path: dist/${{ matrix.target }}/vibeguard-runtime-${{ matrix.target }}
          if-no-files-found: error

      - name: Attest runtime artifact
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/${{ matrix.target }}/vibeguard-runtime-${{ matrix.target }}

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build-runtime
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustc --version

      - name: Download runtime artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate dependency metadata
        run: |
          cargo metadata --locked --manifest-path "${RUNTIME_MANIFEST}" --format-version 1 \
            > dist/vibeguard-runtime-dependency-metadata.json

      - name: Build payload artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash scripts/release/build-payload.sh --version "${TAG_NAME#v}" --output dist
          tar -tzf "dist/vibeguard-payload-${TAG_NAME#v}.tar.gz" | sed 's#^\./##' | grep -qx '.vibeguard-payload'

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vibeguard-runtime-* vibeguard-payload-*.tar.gz | sort -k2,2 > SHA256SUMS
          cat SHA256SUMS

      - name: Generate runtime release manifest
        env:
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/ci/generate_runtime_release_manifest.py \
            "${TAG_NAME#v}" \
            dist \
            dist/vibeguard-runtime-releases.json \
            "${GH_REPO}"

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/SHA256SUMS

      - name: Attest runtime release manifest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/vibeguard-runtime-releases.json

      - name: Attest payload artifact
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/vibeguard-payload-*.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "ERROR: release ${TAG_NAME} already exists; refusing to mutate release assets" >&2
            exit 1
          fi
          gh release create "${TAG_NAME}" dist/vibeguard-runtime-* dist/vibeguard-payload-* dist/SHA256SUMS \
            --title "${TAG_NAME}" \
            --notes "VibeGuard runtime binaries, install payload, release manifest, and dependency metadata for ${TAG_NAME}."

  no-clone-smoke:
    name: No-clone install smoke (${{ matrix.os }})
    needs: publish-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: ubuntu-latest

    steps:
      # Intentionally no actions/checkout step: this job proves that the
      # immutable release is sufficient installation media on a fresh HOME.
      - name: Install and verify from immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077

          VERSION="${TAG_NAME#v}"
          ASSET="vibeguard-payload-${VERSION}.tar.gz"
          DOWNLOAD_DIR="${RUNNER_TEMP}/vibeguard-release"
          SEED_DIR="${RUNNER_TEMP}/vibeguard-bootstrap-seed"
          FRESH_HOME="${RUNNER_TEMP}/vibeguard-fresh-home"
          mkdir -p "${DOWNLOAD_DIR}" "${SEED_DIR}" "${FRESH_HOME}"

          download_ok=0
          for attempt in 1 2 3 4; do
            if gh release download "${TAG_NAME}" \
              --repo "${GH_REPO}" \
              --pattern "${ASSET}" \
              --pattern SHA256SUMS \
              --dir "${DOWNLOAD_DIR}"; then
              download_ok=1
              break
            fi
            rm -f -- "${DOWNLOAD_DIR}/${ASSET}" "${DOWNLOAD_DIR}/SHA256SUMS"
            sleep 5
          done
          if [[ "${download_ok}" != "1" ]]; then
            echo "ERROR: release assets did not become readable after bounded retries" >&2
            exit 1
          fi
          if [[ ! -f "${DOWNLOAD_DIR}/${ASSET}" \
            || -L "${DOWNLOAD_DIR}/${ASSET}" \
            || ! -f "${DOWNLOAD_DIR}/SHA256SUMS" \
            || -L "${DOWNLOAD_DIR}/SHA256SUMS" ]]; then
            echo "ERROR: release download did not produce regular payload and checksum files" >&2
            exit 1
          fi

          expected="$(
            awk -v file="${ASSET}" '
              ($2 == file || $2 == "*" file) { count += 1; digest = $1 }
              END { if (count == 1) print digest; else exit 1 }
            ' "${DOWNLOAD_DIR}/SHA256SUMS"
          )" || {
            echo "ERROR: SHA256SUMS must contain exactly one payload entry" >&2
            exit 1
          }
          if [[ ${#expected} -ne 64 || "${expected}" == *[!0-9a-f]* ]]; then
            echo "ERROR: SHA256SUMS contains an invalid payload digest" >&2
            exit 1
          fi
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          actual="$(sha256_file "${DOWNLOAD_DIR}/${ASSET}")"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "ERROR: payload checksum verification failed" >&2
            exit 1
          fi

          gh attestation verify "${DOWNLOAD_DIR}/${ASSET}" \
            --repo "${GH_REPO}" \
            --signer-workflow "github.com/${GH_REPO}/.github/workflows/release.yml" \
            --source-ref "refs/tags/${TAG_NAME}" \
            --deny-self-hosted-runners

          archive_names="${RUNNER_TEMP}/vibeguard-payload-names"
          archive_types="${RUNNER_TEMP}/vibeguard-payload-types"
          LC_ALL=C tar -tzf "${DOWNLOAD_DIR}/${ASSET}" > "${archive_names}"
          LC_ALL=C tar -tvzf "${DOWNLOAD_DIR}/${ASSET}" > "${archive_types}"
          if ! awk '
            {
              name = $0
              normalized = name
              sub(/\/$/, "", normalized)
              if (name == "" || normalized == "" || name ~ /^\// \
                || name ~ /(^|\/)\.\.?($|\/)/ || name ~ /\/\//) bad = 1
            }
            END { exit bad }
          ' "${archive_names}"; then
            echo "ERROR: payload contains an unsafe archive path" >&2
            exit 1
          fi

          bootstrap_files=(
            scripts/setup/bootstrap.sh
            scripts/setup/bootstrap-lib.sh
            scripts/setup/bootstrap_identity.sh
            scripts/setup/bootstrap_birth_token.jxa
            scripts/setup/bootstrap_process.sh
            scripts/setup/bootstrap_termination.sh
            scripts/setup/bootstrap_lease_terminal.sh
            scripts/setup/bootstrap_lease_retirement.sh
            scripts/setup/bootstrap_state.sh
          )
          for member in "${bootstrap_files[@]}"; do
            if [[ "$(grep -Fxc -- "${member}" "${archive_names}")" != "1" ]]; then
              echo "ERROR: payload must contain exactly one regular ${member}" >&2
              exit 1
            fi
            if ! awk -v file="${member}" '
              $NF == file { count += 1; regular = substr($1, 1, 1) == "-" }
              END { exit !(count == 1 && regular) }
            ' "${archive_types}"; then
              echo "ERROR: payload bootstrap member is not a unique regular file: ${member}" >&2
              exit 1
            fi
          done
          tar -xzf "${DOWNLOAD_DIR}/${ASSET}" -C "${SEED_DIR}" \
            "${bootstrap_files[@]}"
          for member in "${bootstrap_files[@]}"; do
            if [[ ! -f "${SEED_DIR}/${member}" || -L "${SEED_DIR}/${member}" ]]; then
              echo "ERROR: extracted bootstrap member is not a regular file: ${member}" >&2
              exit 1
            fi
          done

          HOME="${FRESH_HOME}" bash "${SEED_DIR}/scripts/setup/bootstrap.sh" \
            --version "${VERSION}" --require-provenance -- --yes --require-provenance
          HOME="${FRESH_HOME}" bash \
            "${FRESH_HOME}/.vibeguard/dist/current/setup.sh" verify-install
          test -x "${FRESH_HOME}/.vibeguard/installed/bin/vibeguard-runtime"
          test -d "${FRESH_HOME}/.vibeguard/installed/rules/claude-rules"
