name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Match tag to Cargo and plugin versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("vibeguard-runtime/Cargo.toml").read_text())["package"]["version"]
          plugin = json.loads(pathlib.Path("plugins/vibeguard/.codex-plugin/plugin.json").read_text())
          assert os.environ["RELEASE_TAG"] == "v" + version
          assert plugin["version"] == version
          PY
      - run: bash scripts/local-contract-check.sh
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add "$TARGET"
      - run: cargo build --locked --release --target "$TARGET" --manifest-path vibeguard-runtime/Cargo.toml
      - name: Smoke the exact native release binary
        run: python3 scripts/ci/smoke_binary.py "vibeguard-runtime/target/$TARGET/release/vibeguard-runtime"
      - name: Package
        run: |
          mkdir -p package dist
          cp "vibeguard-runtime/target/$TARGET/release/vibeguard-runtime" package/
          cp LICENSE README.md package/
          tar -czf "dist/vibeguard-$TARGET.tar.gz" -C package .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vibeguard-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: vibeguard-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
