name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: rustup show
      - run: cargo fmt --manifest-path vibeguard-runtime/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path vibeguard-runtime/Cargo.toml
      - run: cargo clippy --locked --manifest-path vibeguard-runtime/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path vibeguard-runtime/Cargo.toml
  self_application:
    name: Self-Application CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: bash scripts/local-contract-check.sh
