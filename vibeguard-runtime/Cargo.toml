[package]
name = "vibeguard-runtime"
version = "2.0.0"
edition = "2024"
description = "Native coding-agent hooks and a curated rule library"
license = "MIT"
repository = "https://github.com/majiayu000/vibeguard"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml_edit = "0.25.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
